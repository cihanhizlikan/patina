[package]
name = "patina"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "Patina"
path = "src/main.rs"

[dependencies]
# ── UI & windowing (eframe bundles egui + winit + wgpu internally) ────────────
eframe = { version = "0.27", default-features = false, features = [
    "wgpu",          # wgpu backend for maximum GPU performance
    "accesskit",     # accessibility support
    "default_fonts", # egui's built-in font as fallback
] }
egui         = "0.27"
egui_extras  = { version = "0.27", features = ["svg"] }

# ── Image decoding ────────────────────────────────────────────────────────────
image = { version = "0.25", default-features = false, features = [
    "bmp", "png", "jpeg", "gif", "webp", "tiff", "ico",
] }
jxl-oxide = { version = "0.10" }

# ── Error handling ────────────────────────────────────────────────────────────
anyhow = "1"

# ── Logging ───────────────────────────────────────────────────────────────────
# The facade eframe, winit and wgpu already log through (0.4.29 was in
# Cargo.lock before Patina named it, so it adds no code to the binary).
# The logger itself is ours, in logging.rs; no framework crate.
log = "0.4"

# ── Filesystem watching ───────────────────────────────────────────────────────
notify-debouncer-mini = { version = "0.4", default-features = false }

# ── Threading ─────────────────────────────────────────────────────────────────
crossbeam-channel = "0.5"

# ── Recycle Bin / Trash ───────────────────────────────────────────────────────
# Delete moves the file to the Recycle Bin (Windows: IFileOperation with
# FOF_ALLOWUNDO), the macOS Trash or the freedesktop trash, behind a safe
# API, so no `unsafe` of ours. Default features off: `chrono` only serves
# listing the freedesktop trash, which Patina never does. Same crate and
# settings as Devoid Viewer.
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }

# ── Cross-platform file dialogs ───────────────────────────────────────────────
rfd = "0.14"

# ── Data parallelism for pixel pipeline ───────────────────────────────────────
rayon = "1.10"
# ── RAW image decoding ────────────────────────────────────────────────────────
rawler = { version = "0.6", default-features = false }

# ── EXIF/IPTC metadata ────────────────────────────────────────────────────────
kamadak-exif = "0.5"

# ── Explorer's sort order ─────────────────────────────────────────────────────
# Declares StrCmpLogicalW for explorer_order.rs, the one module allowed
# `unsafe`. Bindings only, no code of its own; 0.61.2 was already in
# Cargo.lock through eframe's dependencies, so nothing new is downloaded.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

# ── Lints ─────────────────────────────────────────────────────────────────────
# The bans in clippy.toml are architecture rules, not style, so a
# violation stops the build instead of joining a warning count.
# See docs/settled-decisions.md.
[lints.clippy]
disallowed_methods = "deny"

# Safe Rust everywhere but explorer_order.rs, whose `#![allow]` covers the
# one FFI call Explorer's sort order needs. `deny`, not `forbid`, only so that
# allow can exist; any other `unsafe` is still a build error, and a second
# exception means changing docs/settled-decisions.md first.
[lints.rust]
unsafe_code = "deny"

[build-dependencies]
# build.rs embeds patina.ico and the version block in Patina.exe. Unmaintained
# since 2020 but build-time only; see docs/settled-decisions.md for why it stays.
winres = "0.1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 1
